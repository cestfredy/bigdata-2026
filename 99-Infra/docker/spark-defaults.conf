# =============================================================================
#  Configuration Spark par défaut du poste de TP
#  Ces valeurs sont volontairement modestes : le cluster tourne sur le
#  portable de l'étudiant. Le module 3 (S8) explique comment les dimensionner
#  pour un vrai cluster.
# =============================================================================

spark.master                          local[*]
spark.driver.memory                   2g
spark.executor.memory                 1g
spark.sql.shuffle.partitions          8

# Adaptive Query Execution — activé par défaut depuis Spark 3.2.
# Le module 4 (S10) demande de le désactiver ponctuellement pour observer
# ce qu'il corrige.
spark.sql.adaptive.enabled            true
spark.sql.adaptive.coalescePartitions.enabled true

# --------------------------------------------------- accès HDFS et YARN
spark.hadoop.fs.defaultFS             hdfs://namenode:8020
# Les jars Spark sont publies UNE FOIS sur HDFS par publier_jars_spark.sh.
# Ne pas utiliser local: — le NodeManager tourne sur l image apache/hadoop,
# qui ne contient aucun Spark. Sans cette ligne, chaque soumission
# reteleverserait 665 Mio de jars vers HDFS.
spark.yarn.jars                       hdfs://namenode:8020/spark/jars/*

# ------------------------------------------------- stockage objet MinIO
spark.hadoop.fs.s3a.endpoint          http://minio:9000
spark.hadoop.fs.s3a.access.key        minioadmin
spark.hadoop.fs.s3a.secret.key        minioadmin
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.impl              org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# ------------------------------------------------------------ Iceberg
spark.sql.extensions                  org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lakehouse           org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type      hadoop
spark.sql.catalog.lakehouse.warehouse s3a://lakehouse/

# ------------------------------------------------------ journalisation
spark.eventLog.enabled                false
spark.ui.showConsoleProgress          true
